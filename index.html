<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f1b16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Send orders from the front tablet to the kitchen over local Wi-Fi.">
  <title>Yes Chef</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved light/dark override before first paint (see js/theme.js).
    try {
      const t = localStorage.getItem('yes-chef-theme')
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
    } catch {}
  </script>
</head>
<body>
  <div id="app"><main class="empty"><p>Loading…</p></main></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
