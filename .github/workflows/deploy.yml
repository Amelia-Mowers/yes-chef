name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Head + kitchen pair over public Nostr relays, so retry once if a relay is flaky.
      - name: End-to-end tests
        run: node test/e2e.mjs || node test/e2e.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: test/shots/
          if-no-files-found: ignore

  # app.yes-chef.win (the app) and yes-chef.win (marketing site) as static-assets
  # Workers (deploy/*/wrangler.jsonc, which also own the custom domains).
  # Skipped until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist.
  deploy-cloudflare:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Check Cloudflare is configured
        id: cf
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Cloudflare secrets not set; skipping Cloudflare deploy"; fi
      - name: Assemble app
        if: steps.cf.outputs.ready
        run: tools/assemble.sh _site
      - name: Deploy app to app.yes-chef.win
        if: steps.cf.outputs.ready
        run: npx --yes wrangler@4 deploy --config deploy/app/wrangler.jsonc
      - name: Deploy marketing site to yes-chef.win
        if: steps.cf.outputs.ready
        run: npx --yes wrangler@4 deploy --config deploy/site/wrangler.jsonc

  # The old GitHub Pages address. Kept so installed tablets get the "moved" banner;
  # remove once nobody uses amelia-mowers.github.io/yes-chef.
  deploy-github-pages:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: tools/assemble.sh _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
