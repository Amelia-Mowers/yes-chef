name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Head + kitchen pair over public Nostr relays, so retry once if a relay is flaky.
      - name: End-to-end tests
        run: node test/e2e.mjs || node test/e2e.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: test/shots/
          if-no-files-found: ignore

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Publish only the app, not tests, tools or dev dependencies.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js vendor icons _site/
          # Stamp the build so every deploy is a new service-worker version.
          build="${GITHUB_SHA::7}"
          sed -i "s/^const VERSION = .*/const VERSION = 'yes-chef-$build'/" _site/sw.js
          sed -i "s/^export const BUILD = .*/export const BUILD = '$build'/" _site/js/version.js
          grep -q "yes-chef-$build" _site/sw.js && grep -q "'$build'" _site/js/version.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
